platform_cac_repo_url: "<PLATFORM_CAC_REPOSITORY_URL>"

ldap_host: "<LDAP_SERVER_URI>"
ldap_bind_dn: "<LDAP_BIND_DN>"
ldap_user_search_base: "<LDAP_USER_SEARCH_BASE_DN>"
ldap_user_search_filter: "<LDAP_USER_SEARCH_FILTER>"
ldap_group_search_base: "<LDAP_GROUP_SEARCH_BASE_DN>"
ldap_group_search_filter: "<LDAP_GROUP_SEARCH_FILTER>"
ldap_group_type: "<LDAP_GROUP_TYPE>"
ldap_group_name_attr: "<LDAP_GROUP_NAME_ATTRIBUTE>"
ldap_start_tls: <LDAP_START_TLS>

platform_access_group_dn: "<PLATFORM_ACCESS_GROUP_DN>"
platform_admin_group_dn: "<PLATFORM_ADMIN_GROUP_DN>"
