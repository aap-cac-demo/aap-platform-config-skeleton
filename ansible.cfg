[defaults]
collections_path = ./collections

[galaxy]
# Keep certificate verification enabled unless the customer explicitly requires
# a different setting for a trusted internal Hub.
ignore_certs = false
#server_list = rhv, rhp, hub_rh_certified, hub_validated, hub_published
server_list = rhv, rhp

# [galaxy_server.hub_rh_certified]
# url=https://aap-aap-operator.apps.127.0.0.1.nip.io/api/galaxy/content/rh-certified/

# [galaxy_server.hub_validated]
# url=https://aap-aap-operator.apps.127.0.0.1.nip.io/api/galaxy/content/validated/

# [galaxy_server.hub_published]
# url=https://aap-aap-operator.apps.127.0.0.1.nip.io/api/galaxy/content/published/
# Auth via env vars (do not commit credentials):
#   export ANSIBLE_GALAXY_SERVER_HUB_RH_CERTIFIED_USERNAME="<HUB_USERNAME>"
#   export ANSIBLE_GALAXY_SERVER_HUB_RH_CERTIFIED_PASSWORD="<HUB_PASSWORD>"
#   (same pattern for HUB_VALIDATED and HUB_PUBLISHED)


[galaxy_server.rhv]
url=https://console.redhat.com/api/automation-hub/content/validated/
auth_url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token

[galaxy_server.rhp]
url=https://console.redhat.com/api/automation-hub/content/published/
auth_url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
