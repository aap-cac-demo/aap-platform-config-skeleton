---
# Environment-scoped platform values. Replace every angle-bracket token.

platform_cac_repo_url: "https://github.com/aap-cac-demo/aap-platform-config-skeleton"

ldap_host: "ldap://172.16.45.1:3890"
ldap_bind_dn: "uid=aap-ldap-bind,cn=users,cn=accounts,dc=demo,dc=internal"
ldap_user_search_base: "cn=users,cn=accounts,dc=demo,dc=internal"
ldap_user_search_filter: "(uid=%(user)s)"
ldap_group_search_base: "cn=groups,cn=accounts,dc=demo,dc=internal"
ldap_group_search_filter: "(objectClass=groupofnames)"
ldap_group_type: "MemberDNGroupType"
ldap_group_name_attr: "cn"
ldap_group_member_attr: "member"
ldap_start_tls: false

platform_access_group_dn: "cn=access,cn=accounts,dc=demo,dc=internal"
platform_admin_group_dn: "cn=admin,cn=accounts,dc=demo,dc=internal"
platform_operator_group_dn: "cn=operator,cn=accounts,dc=demo,dc=internal"

hub_galaxy_token_expire_seconds: 31536000
hub_galaxy_token_refresh_buffer: 0.75
hub_custom_collection_namespace: "platform"
...
