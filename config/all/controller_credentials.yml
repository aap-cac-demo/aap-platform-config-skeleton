---
# Platform-managed credentials. Team credentials are generated during
# onboarding from completed team definition files.
controller_credentials_all:
  - name: platform-scm
    description: "SCM credential for CaC project sync"
    organization: Platform
    credential_type: "Source Control"
    inputs:
      username: "{{ scm_username }}"
      password: "{{ scm_token }}"
    state: present

  - name: platform-gateway-cred
    description: "AAP gateway credential for platform JT execution"
    organization: Platform
    credential_type: "AAP CaC Credential"
    inputs:
      host: "{{ aap_hostname }}"
      username: "{{ aap_username }}"
      password: "{{ aap_password }}"
      verify_ssl: "{{ aap_validate_certs | bool }}"
    state: present

  - name: platform-secrets
    description: "Platform secrets for scheduled JTs"
    organization: Platform
    credential_type: "Platform Secrets"
    inputs:
      redhat_api_token: "{{ redhat_api_token }}"
    state: present
...
