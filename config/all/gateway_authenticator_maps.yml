---
# LDAP group-to-role/team mappings. Team-specific maps are generated by
# team_onboarding.yml from completed team definition files.
gateway_authenticator_maps_all:
  - name: platform-access-map
    authenticator: corporate-ldap
    map_type: allow
    triggers:
      groups:
        has_or:
          - "{{ platform_access_group_dn }}"
    order: 0
    revoke: true
    state: present

  - name: platform-superuser-map
    authenticator: corporate-ldap
    map_type: is_superuser
    triggers:
      groups:
        has_or:
          - "{{ platform_admin_group_dn }}"
    order: 1
    state: present

  - name: platform-operators-map
    authenticator: corporate-ldap
    map_type: team
    triggers:
      groups:
        has_or:
          - "{{ platform_operator_group_dn }}"
    organization: Platform
    team: platform-operators
    role: "Team Member"
    order: 2
    state: present
...
